# Host ports avoid medi-info (5432/8000/5173) so both projects can run at once.
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      retries: 10

  sim:
    build: .
    init: true
    # Run as the WSL user so logs/ and ground_truth/ are not owned by root.
    user: "1000:1000"
    ports:
      - "8100:8000"
    volumes:
      - .:/app
    command: uvicorn server.app:app --host 0.0.0.0 --port 8000 --reload

  analysis:
    build: ./analysis
    init: true
    user: "1000:1000"
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      # Ollama runs as a systemd service in WSL, outside Docker.
      OLLAMA_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8101:8000"
    volumes:
      - ./analysis:/app
      # Read-only, and ground_truth/ is not mounted at all: the analyzer must not see the answers.
      - ./logs:/logs:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./web
    init: true
    environment:
      API_TARGET: http://sim:8000
      ANALYSIS_TARGET: http://analysis:8000
    ports:
      - "5174:5173"
    volumes:
      - ./web:/app
      - /app/node_modules
    depends_on:
      - sim
      - analysis

volumes:
  pgdata:
