apiVersion: v1
kind: Service
metadata:
  name: analysis
  namespace: automachine
spec:
  selector:
    app: analysis
  ports:
    - port: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: analysis
  namespace: automachine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analysis
  template:
    metadata:
      labels:
        app: analysis
    spec:
      # Otherwise the db Service adds DB_PORT=tcp://... to the environment, the same name the app reads.
      enableServiceLinks: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: analysis
          image: localhost:5000/automachine-analysis:dev
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: analysis-config
            - secretRef:
                name: db-credentials
          volumeMounts:
            - name: logs
              mountPath: /logs
              readOnly: true
      # Read-only, and ground_truth/ is not mounted at all: the analyzer must not see the answers.
      volumes:
        - name: logs
          hostPath:
            path: /home/lhy/projects/automachine_AI_log_analyze/logs
            type: Directory
---
# Ollama runs as a systemd service in WSL because it needs the GPU, so this Service points outside the cluster.
# 10.42.0.1 is this PC as seen from the pods, which unlike the Wi-Fi address stays the same on any network.
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: automachine
spec:
  ports:
    - port: 11434
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: ollama
  namespace: automachine
  labels:
    kubernetes.io/service-name: ollama
addressType: IPv4
ports:
  - port: 11434
endpoints:
  - addresses:
      - 10.42.0.1
