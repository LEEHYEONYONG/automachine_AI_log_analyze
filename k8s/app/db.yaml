# PostgreSQL + pgvector. A StatefulSet with a volume claim keeps the data when the pod is replaced.
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: automachine
spec:
  clusterIP: None
  selector:
    app: db
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
  namespace: automachine
spec:
  serviceName: db
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
        - name: db
          image: pgvector/pgvector:pg17
          ports:
            - containerPort: 5432
          # Memory beyond what queries need goes to the page cache, which the kernel gives back under the limit.
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1536Mi
          # First start or crash recovery can take a while, so liveness waits for this to pass.
          startupProbe:
            exec:
              command: [sh, -c, 'pg_isready -q -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            exec:
              command: [sh, -c, 'pg_isready -q -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command: [sh, -c, 'pg_isready -q -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 5
            timeoutSeconds: 3
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: db-credentials, key: DB_USER }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: db-credentials, key: DB_PASS }
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef: { name: db-credentials, key: DB_NAME }
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
            # Runs only when the data directory is empty, as under Compose.
            - name: init
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: init
          configMap:
            name: db-init
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 10Gi
