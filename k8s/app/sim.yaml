# The simulator keeps the machine's state in memory, so there is exactly one replica.
apiVersion: v1
kind: Service
metadata:
  name: sim
  namespace: automachine
spec:
  selector:
    app: sim
  ports:
    - port: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sim
  namespace: automachine
spec:
  replicas: 1
  revisionHistoryLimit: 5
  # Two simulators must never run at once (each would write its own run), so the old one stops first.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: sim
  template:
    metadata:
      labels:
        app: sim
    spec:
      # Run as the WSL user so logs/ and ground_truth/ are not owned by root, as under Compose.
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: sim
          image: localhost:5000/automachine-sim:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          # Measured about 60 MiB at normal speed. CPU limit is generous because ×300 speed is CPU heavy.
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: "2"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /api/state
              port: 8000
            periodSeconds: 2
            failureThreshold: 30
          # A restart loses the running machine's state, so be slow to decide it is dead.
          # /api/state keeps answering after the simulation loop stops; /api/live checks the loop itself.
          livenessProbe:
            httpGet:
              path: /api/live
              port: 8000
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/state
              port: 8000
            periodSeconds: 5
            timeoutSeconds: 3
          volumeMounts:
            - name: logs
              mountPath: /app/logs
            - name: ground-truth
              mountPath: /app/ground_truth
      volumes:
        - name: logs
          hostPath:
            path: /home/lhy/projects/automachine_AI_log_analyze/logs
            type: Directory
        - name: ground-truth
          hostPath:
            path: /home/lhy/projects/automachine_AI_log_analyze/ground_truth
            type: Directory
